server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # nginx >= 1.21 already maps `application/wasm` to .wasm in mime.types,
    # which is required for WebAssembly.instantiateStreaming().
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/wasm
        application/manifest+json
        image/svg+xml;

    # ---------------------------------------------------------------------
    # Server-side model files API.
    #
    # Proxied to the optional `files-api` sidecar (see docker-compose.yml).
    # The upstream is a *variable* resolved at request time, so this image
    # still starts (and serves the app) in single-container deployments with
    # no sidecar present — /api/* then simply returns 502.
    # ---------------------------------------------------------------------
    location /api/ {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $files_api "http://files-api:8080";
        proxy_pass $files_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 12m;
    }

    # The service worker and the HTML entrypoint must never be cached, or
    # users would get stuck on a stale shell.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # Scripts and stylesheets are emitted with *unhashed* names (index.js,
    # openscad-worker.js, …), so they must be revalidated on every load.
    # Long-caching them makes a browser keep running a previous build for days
    # after a redeploy — which silently defeats fixes (including worker
    # changes). ETag revalidation keeps this cheap (usually a 304).
    location ~* \.(?:js|css|wasm)$ {
        add_header Cache-Control "no-cache";
        expires 0;
        access_log off;
        try_files $uri =404;
    }

    # Immutable, large binary/asset payloads that are effectively static
    # (libraries, fonts, media).
    location ~* \.(?:woff2?|ttf|png|jpe?g|gif|svg|glb|gltf|zip|wav|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # Single-page app fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
