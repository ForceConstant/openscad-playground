# Docker Compose for self-hosting OpenSCAD Playground with server-side files.
#
#   docker compose up -d          # start (builds/pulls on first run)
#   docker compose pull && docker compose up -d   # update to the latest images
#   docker compose down           # stop and remove
#
# Two services:
#   * openscad-playground — the static web app (nginx). Stateless.
#   * files-api           — a tiny API over a shared folder, so every browser
#                           sees the same models and saves are written back to
#                           the host folder.
#
# The playground is otherwise stateless; only the `models` folder is persisted.
services:
  openscad-playground:
    image: ghcr.io/forceconstant/openscad-playground:latest
    # To build the image locally from this repository instead of pulling it,
    # comment out the `image:` line above and uncomment the next line:
    # build: .
    container_name: openscad-playground
    ports:
      # host:container — browse to http://localhost:8080/
      - "8080:80"
    depends_on:
      - files-api
    restart: unless-stopped
    # A healthcheck is defined in the image and is picked up automatically.

  files-api:
    image: ghcr.io/forceconstant/openscad-files-api:latest
    # Build locally from this repository instead of pulling:
    # build:
    #   context: .
    #   dockerfile: docker/files-api.Dockerfile
    container_name: openscad-files-api
    environment:
      # Directory inside the container to serve. Keep in sync with the volume.
      FILES_DIR: /models
      # Extensions exposed through the API (comma-separated).
      ALLOWED_EXT: .scad,.json
    volumes:
      # Host folder holding the models. Change the left-hand side to any path
      # (e.g. /mnt/user/appdata/openscad/models on Unraid). The folder must be
      # writable by uid/gid 1000 (the `node` user), which is what the container
      # runs as:
      #   mkdir -p ./models && sudo chown 1000:1000 ./models
      - ./models:/models
    restart: unless-stopped
    # Healthcheck is defined in the image (GET /api/health).
